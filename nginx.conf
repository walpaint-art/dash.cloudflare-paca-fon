# =========================================================
#  Nginx - proxy reverso para o Videochamada Web
#  Copie para /etc/nginx/sites-available/chamada
#  e crie o link em /etc/nginx/sites-enabled
# =========================================================

server {
    listen 80;
    server_name SEU-DOMINIO.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SEU-DOMINIO.com.br;

    # Certificado (obtido com: certbot --nginx -d SEU-DOMINIO.com.br)
    ssl_certificate     /etc/letsencrypt/live/SEU-DOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU-DOMINIO.com.br/privkey.pem;

    # Vídeo e áudio WebRTC passam direto (UDP), então não é preciso configurar
    # apenas o proxy HTTP/WebSocket. Para TURN, abra as portas 3478 (tcp/udp).

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
