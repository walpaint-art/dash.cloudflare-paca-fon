services:
  - type: web
    name: videochamada-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Link com senha: https://SEU-SERVICO.onrender.com/?token=XXXX
      - key: ACCESS_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
